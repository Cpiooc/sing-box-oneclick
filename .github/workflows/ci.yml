name: Validate installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          for f in lib/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl curl ca-certificates nginx

      - name: Module integration smoke test
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/module-smoke.sh

      - name: Validate novice safety hardening
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/hardening.sh

      - name: Validate BBR on off restore manager
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/bbr-manager.sh

      - name: Validate sing-box core version manager
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/core-manager.sh

      - name: Validate HTTPS subscription config
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/subscription-config.sh

      - name: Validate bundle SHA256
        run: |
          expected=$(awk '
            /MODULES=\(/ {in_modules=1; next}
            in_modules && /^\)/ {in_modules=0; next}
            in_modules && /"lib\// {
              line=$0
              sub(/^[[:space:]]*"/, "", line)
              sub(/"[[:space:]]*$/, "", line)
              print line
            }
          ' install.sh)
          echo "Actual bundle SHA256:"
          sha256sum install.sh $expected VERSION
          sha256sum -c SHA256SUMS
          for f in install.sh $expected VERSION; do
            grep -Fq "  $f" SHA256SUMS || { echo "missing SHA256 entry: $f" >&2; exit 1; }
          done

      - name: Install current stable sing-box
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://sing-box.app/install.sh -o /tmp/install-sing-box.sh
          bash -n /tmp/install-sing-box.sh
          sudo bash /tmp/install-sing-box.sh
          sing-box version

      - name: Validate representative server configs
        run: bash tests/validate-configs.sh

      - name: Validate HY2 port hopping exports
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/hy2-hop.sh

      - name: Validate AnyTLS Trojan and Shadowsocks helpers
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/extra-protocols.sh

      - name: Validate in-place parameter editing
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/editor-patch.sh

      - name: Validate generated client configs
        env:
          NO_COLOR: "1"
          TERM: dumb
        run: bash tests/client-export.sh
